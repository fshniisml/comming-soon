<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrefour des Livres — Bientôt disponible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    /* Palette officielle CDL — Rouge Héritage, Transformative Teal, Noir/Blanc uniquement */
    --rouge: #B23A2E;
    --teal: #1F6F6B;
    --teal-tint: #D9E6E4;
    --paper: #FAF8F4;
    --ink: #191714;
    --ink-soft: #514C44;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family:'Gill Sans','Gill Sans MT','Century Gothic','Segoe UI',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }

  .pattern{
    position:absolute;
    inset:-20%;
    width:140%;
    height:140%;
    z-index:0;
    opacity:0.12;
    animation: spin 180s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .pattern{ animation:none; }
  }
  @keyframes spin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:1400px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:0 40px;
  }

  .side-logo{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .side-logo img{
    height:320px;
    width:auto;
    display:block;
  }
  @media (max-width: 980px){
    .side-logo{ display:none; }
  }

  .wrap{
    flex:1 1 auto;
    max-width:720px;
    padding:48px 32px;
    text-align:center;
    margin:0 auto;
  }

  .eyebrow{
    font-size:0.9rem;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color: var(--ink-soft);
    font-weight:600;
    margin-bottom:32px;
  }

  .tagline{
    font-family:'Source Serif 4', serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(1.6rem, 3.6vw, 2.3rem);
    color: var(--teal);
    margin-bottom:34px;
  }

  .desc{
    font-family:'Source Serif 4', serif;
    font-size:clamp(1.15rem, 2vw, 1.4rem);
    color: var(--ink-soft);
    line-height:1.8;
    max-width:560px;
    margin:0 auto 52px;
  }

  .rule{
    width:48px;
    height:2px;
    background: var(--rouge);
    margin:0 auto 52px;
  }

  .notify{
    display:flex;
    gap:14px;
    max-width:480px;
    margin:0 auto;
    flex-wrap:wrap;
    justify-content:center;
  }
  .notify input{
    flex:1;
    min-width:260px;
    padding:18px 22px;
    border:1.5px solid var(--teal-tint);
    background:#fff;
    border-radius:0;
    font-family:'Gill Sans','Gill Sans MT','Century Gothic',sans-serif;
    font-size:1.1rem;
    color:var(--ink);
    outline-offset:2px;
  }
  .notify input:focus-visible{
    outline:2px solid var(--teal);
  }
  .notify button{
    padding:18px 32px;
    background: var(--rouge);
    color:#FAF8F4;
    border:none;
    border-radius:0;
    font-family:'Gill Sans','Gill Sans MT','Century Gothic',sans-serif;
    font-weight:600;
    font-size:1.1rem;
    letter-spacing:0.03em;
    cursor:pointer;
    transition: background 0.2s ease;
  }
  .notify button:hover{
    background: var(--teal);
  }
  .notify button:focus-visible{
    outline:2px solid var(--rouge);
    outline-offset:2px;
  }

  .status{
    margin-top:20px;
    font-size:1rem;
    color: var(--ink-soft);
    min-height:1.2em;
  }

  .lang-switch{
    position:fixed;
    top:24px;
    right:24px;
    z-index:2;
    display:flex;
    gap:2px;
    background:#fff;
    border:1.5px solid var(--teal-tint);
  }
  html[dir="rtl"] .lang-switch{
    right:auto;
    left:24px;
  }
  .lang-switch button{
    padding:8px 14px;
    border:none;
    background:transparent;
    font-family:'Gill Sans','Gill Sans MT','Century Gothic',sans-serif;
    font-size:0.85rem;
    letter-spacing:0.05em;
    color: var(--ink-soft);
    cursor:pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .lang-switch button:hover{
    background: var(--teal-tint);
  }
  .lang-switch button.active{
    background: var(--rouge);
    color:#FAF8F4;
  }
  .lang-switch button:focus-visible{
    outline:2px solid var(--teal);
    outline-offset:-2px;
  }
  @media (max-width: 560px){
    .lang-switch{ top:14px; right:14px; }
    html[dir="rtl"] .lang-switch{ left:14px; right:auto; }
  }

  html[dir="rtl"] body{
    font-family:'Tahoma','Segoe UI',sans-serif;
  }
</style>
</head>
<body>

<div class="lang-switch" role="group" aria-label="Choix de la langue">
  <button type="button" data-lang="fr" class="active">FR</button>
  <button type="button" data-lang="ar">AR</button>
  <button type="button" data-lang="en">EN</button>
</div>

<svg class="pattern" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <pattern id="triangles" width="70" height="70" patternUnits="userSpaceOnUse">
      <polygon points="35,10 60,55 10,55" fill="none" stroke="#1F6F6B" stroke-width="1"/>
      <polygon points="0,60 15,35 30,60" fill="none" stroke="#B23A2E" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#triangles)"/>
</svg>

<div class="page">

  <div class="side-logo">
    <img src="logo-librairie.png" alt="Carrefour des Livres — Librairie, depuis 1984">
  </div>

  <div class="wrap">
    <div class="eyebrow" data-i18n="eyebrow">Bientôt disponible</div>
    <p class="tagline" data-i18n="tagline">Là où l'ancrage rencontre l'envol.</p>
    <p class="desc" data-i18n="desc">Notre librairie et notre maison d'édition prennent vie en ligne. Laissez votre email pour être averti·e dès l'ouverture.</p>

    <div class="rule" aria-hidden="true"></div>

    <form class="notify" id="notifyForm">
      <input type="email" id="emailInput" data-i18n-placeholder="placeholder" placeholder="votre@email.com" required aria-label="Adresse email">
      <button type="submit" data-i18n="button">M'avertir</button>
    </form>
    <div class="status" id="status" role="status"></div>
  </div>

  <div class="side-logo">
    <img src="logo-editions.png" alt="Carrefour des Livres — Éditions">
  </div>

</div>

<script>
  var translations = {
    fr: {
      dir: 'ltr',
      eyebrow: 'Bientôt disponible',
      tagline: "Là où l'ancrage rencontre l'envol.",
      desc: "Notre librairie et notre maison d'édition prennent vie en ligne. Laissez votre email pour être averti·e dès l'ouverture.",
      placeholder: 'votre@email.com',
      button: "M'avertir",
      thanks: "Merci ! Nous vous préviendrons à "
    },
    ar: {
      dir: 'rtl',
      eyebrow: 'قريباً',
      tagline: 'حيث يلتقي الرسوخ بالانطلاق.',
      desc: 'مكتبتنا ودار النشر الخاصة بنا تُبصر النور على الإنترنت. اترك بريدك الإلكتروني لتصلك رسالة فور الافتتاح.',
      placeholder: 'بريدك الإلكتروني',
      button: 'أعلمني',
      thanks: 'شكراً! سنراسلك على '
    },
    en: {
      dir: 'ltr',
      eyebrow: 'Coming soon',
      tagline: 'Where roots meet flight.',
      desc: 'Our bookshop and publishing house are coming to life online. Leave your email to be notified at launch.',
      placeholder: 'your@email.com',
      button: 'Notify me',
      thanks: "Thanks! We'll email you at "
    }
  };

  var currentLang = 'fr';

  function applyLang(lang){
    currentLang = lang;
    var t = translations[lang];
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', t.dir);
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      el.textContent = t[el.getAttribute('data-i18n')];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){
      el.setAttribute('placeholder', t[el.getAttribute('data-i18n-placeholder')]);
    });
    document.getElementById('status').textContent = '';
    document.querySelectorAll('.lang-switch button').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
    });
  }

  document.querySelectorAll('.lang-switch button').forEach(function(btn){
    btn.addEventListener('click', function(){
      applyLang(btn.getAttribute('data-lang'));
    });
  });

  document.getElementById('notifyForm').addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('emailInput').value;
    var status = document.getElementById('status');
    if(email){
      status.textContent = translations[currentLang].thanks + email;
      document.getElementById('emailInput').value = '';
    }
  });
</script>

</body>
</html>
