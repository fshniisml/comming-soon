<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrefour des Livres — Bientôt disponible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    /* Palette officielle CDL — Rouge Héritage, Transformative Teal, Noir/Blanc uniquement */
    --rouge: #B23A2E;
    --teal: #1F6F6B;
    --teal-tint: #D9E6E4;
    --paper: #FAF8F4;
    --ink: #191714;
    --ink-soft: #514C44;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family:'Gill Sans','Gill Sans MT','Century Gothic','Segoe UI',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }

  .pattern{
    position:absolute;
    inset:-20%;
    width:140%;
    height:140%;
    z-index:0;
    opacity:0.12;
    animation: spin 180s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .pattern{ animation:none; }
  }
  @keyframes spin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:1400px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:0 40px;
  }

  .side-logo{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .side-logo img{
    height:320px;
    width:auto;
    display:block;
  }
  @media (max-width: 980px){
    .side-logo{ display:none; }
  }

  .wrap{
    flex:1 1 auto;
    max-width:720px;
    padding:48px 32px;
    text-align:center;
    margin:0 auto;
  }

  .eyebrow{
    font-size:0.9rem;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color: var(--ink-soft);
    font-weight:600;
    margin-bottom:32px;
  }

  .tagline{
    font-family:'Source Serif 4', serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(1.6rem, 3.6vw, 2.3rem);
    color: var(--teal);
    margin-bottom:34px;
  }

  .desc{
    font-family:'Source Serif 4', serif;
    font-size:clamp(1.15rem, 2vw, 1.4rem);
    color: var(--ink-soft);
    line-height:1.8;
    max-width:560px;
    margin:0 auto 52px;
  }

  .rule{
    width:48px;
    height:2px;
    background: var(--rouge);
    margin:0 auto 52px;
  }

  .notify{
    display:flex;
    gap:14px;
    max-width:480px;
    margin:0 auto;
    flex-wrap:wrap;
    justify-content:center;
  }
  .notify input{
    flex:1;
    min-width:260px;
    padding:18px 22px;
    border:1.5px solid var(--teal-tint);
    background:#fff;
    border-radius:0;
    font-family:'Gill Sans','Gill Sans MT','Century Gothic',sans-serif;
    font-size:1.1rem;
    color:var(--ink);
    outline-offset:2px;
  }
  .notify input:focus-visible{
    outline:2px solid var(--teal);
  }
  .notify button{
    padding:18px 32px;
    background: var(--rouge);
    color:#FAF8F4;
    border:none;
    border-radius:0;
    font-family:'Gill Sans','Gill Sans MT','Century Gothic',sans-serif;
    font-weight:600;
    font-size:1.1rem;
    letter-spacing:0.03em;
    cursor:pointer;
    transition: background 0.2s ease;
  }
  .notify button:hover{
    background: var(--teal);
  }
  .notify button:focus-visible{
    outline:2px solid var(--rouge);
    outline-offset:2px;
  }

  .status{
    margin-top:20px;
    font-size:1rem;
    color: var(--ink-soft);
    min-height:1.2em;
  }
</style>
</head>
<body>

<svg class="pattern" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <pattern id="triangles" width="70" height="70" patternUnits="userSpaceOnUse">
      <polygon points="35,10 60,55 10,55" fill="none" stroke="#1F6F6B" stroke-width="1"/>
      <polygon points="0,60 15,35 30,60" fill="none" stroke="#B23A2E" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#triangles)"/>
</svg>

<div class="page">

  <div class="side-logo">
    <img src="logo-librairie.png" alt="Carrefour des Livres — Librairie, depuis 1984">
  </div>

  <div class="wrap">
    <div class="eyebrow">Bientôt disponible</div>
    <p class="tagline">Là où l'ancrage rencontre l'envol.</p>
    <p class="desc">Notre librairie et notre maison d'édition prennent vie en ligne. Laissez votre email pour être averti·e dès l'ouverture.</p>

    <div class="rule" aria-hidden="true"></div>

    <form class="notify" id="notifyForm">
      <input type="email" id="emailInput" placeholder="votre@email.com" required aria-label="Adresse email">
      <button type="submit">M'avertir</button>
    </form>
    <div class="status" id="status" role="status"></div>
  </div>

  <div class="side-logo">
    <img src="logo-editions.png" alt="Carrefour des Livres — Éditions">
  </div>

</div>

<script>
  document.getElementById('notifyForm').addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('emailInput').value;
    var status = document.getElementById('status');
    if(email){
      status.textContent = "Merci ! Nous vous préviendrons à " + email + " dès l'ouverture.";
      document.getElementById('emailInput').value = '';
    }
  });
</script>

</body>
</html>
